name: Build Wisp & Co Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable debug package
        uses: actions/upload-artifact@v4
        with:
          name: WispAndCo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
