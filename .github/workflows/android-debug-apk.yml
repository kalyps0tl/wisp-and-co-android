name: Build Wisp & Co Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35 using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using $SDKMANAGER"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      # Keep one test signing identity across builds, without checking the key into Git.
      - name: Restore development debug signing key
        uses: actions/cache@v4
        with:
          path: app/signing/dev-debug.keystore
          key: wisp-co-android-debug-key-v2
      - name: Create development signing key when missing
        shell: bash
        run: |
          mkdir -p app/signing
          if [ ! -f app/signing/dev-debug.keystore ]; then
            keytool -genkeypair -v -keystore app/signing/dev-debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Wisp Development,O=Wisp and Co,C=CA"
          fi
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable debug package
        uses: actions/upload-artifact@v4
        with:
          name: WispAndCo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
